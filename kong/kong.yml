# Kong sem banco (declarativo): toda a configuração do gateway num arquivo só.
# __JWT_SECRET__ é trocado pelo valor da variável JWT_SECRET quando o container sobe
# (ver o entrypoint do serviço gateway no docker-compose.yml).
#
# Três tipos de rota, três receitas:
#   publico: nenhum plugin de acesso
#   logado : só jwt                (401 sem token ou token inválido)
#   admin  : jwt + acl allow admin (401 sem token · 403 perfil cliente)
_format_version: "3.0"

services:
  # ---------------------------------------------------------------- usuarios
  - name: usuarios
    url: http://usuarios:3000
    routes:
      - name: login # contra força bruta: a 11ª tentativa no minuto recebe 429
        methods: [POST]
        paths: ["~/auth/login$"]
        strip_path: false
        tags: [publico]
        plugins:
          - name: rate-limiting
            config:
              minute: 10
              limit_by: ip
              policy: local

      - name: cadastro # POST /usuarios
        methods: [POST]
        paths: ["~/usuarios$"]
        strip_path: false
        tags: [publico]

      - name: listar-usuarios # GET /usuarios
        methods: [GET]
        paths: ["~/usuarios$"]
        strip_path: false
        tags: [admin]
        plugins: &so-admin
          - &jwt
            name: jwt
            config:
              key_claim_name: perfil
              claims_to_verify: [exp]
          - name: acl
            config:
              allow: [admin]

      - name: meus-dados # /usuarios/me e /usuarios/me/enderecos
        paths: ["~/usuarios/me(/.*)?$"]
        strip_path: false
        tags: [logado]
        plugins: &logado [*jwt]

  - name: usuarios-health # GET /health/usuarios → usuarios:3000/health
    url: http://usuarios:3000/health
    routes:
      - name: health-usuarios
        methods: [GET]
        paths: ["/health/usuarios"]
        strip_path: true
        tags: [publico]

  # ---------------------------------------------------------------- catalogo
  - name: catalogo
    url: http://catalogo:3000
    routes:
      - name: vitrine # GET é público
        methods: [GET]
        paths: ["~/(produtos|categorias)(/.*)?$"]
        strip_path: false
        tags: [publico]

      - name: gestao-catalogo # mesmo caminho, outros métodos: admin
        methods: [POST, PUT, PATCH, DELETE]
        paths: ["~/(produtos|categorias)(/.*)?$"]
        strip_path: false
        tags: [admin]
        plugins: *so-admin

  - name: catalogo-health
    url: http://catalogo:3000/health
    routes:
      - name: health-catalogo
        methods: [GET]
        paths: ["/health/catalogo"]
        strip_path: true
        tags: [publico]

  # ---------------------------------------------------------------- pedidos
  - name: pedidos
    url: http://pedidos:3000
    routes:
      - name: carrinho-e-pedidos
        paths: ["~/(carrinho|pedidos)(/.*)?$"]
        strip_path: false
        tags: [logado]
        plugins: *logado

  - name: pedidos-health
    url: http://pedidos:3000/health
    routes:
      - name: health-pedidos
        methods: [GET]
        paths: ["/health/pedidos"]
        strip_path: true
        tags: [publico]

# Os consumers são PERFIS, não pessoas. O jwt acha o consumer pelo campo
# "perfil" do token (key_claim_name: perfil). Perfil inventado → 401.
consumers:
  - username: cliente
    jwt_secrets:
      - key: cliente
        algorithm: HS256
        secret: "__JWT_SECRET__"
    acls:
      - group: cliente

  - username: admin
    jwt_secrets:
      - key: admin
        algorithm: HS256
        secret: "__JWT_SECRET__"
    acls:
      - group: admin

# Plugins globais: valem para todas as rotas.
plugins:
  # Dá um X-Request-Id a cada requisição (inclusive as recusadas) e devolve ao cliente.
  - name: correlation-id
    config:
      header_name: X-Request-Id
      generator: uuid
      echo_downstream: true

  # Antes de tudo: apaga os X-User-* que o cliente mandou. Ninguém escolhe quem é.
  - name: pre-function
    config:
      access:
        - |
          kong.service.request.clear_header("X-User-Id")
          kong.service.request.clear_header("X-User-Email")
          kong.service.request.clear_header("X-User-Role")

  # Depois do jwt e do acl: copia id, e-mail e perfil do token para os cabeçalhos
  # que os serviços leem. Só quando o jwt identificou um consumer (rotas logado/admin).
  # A decisão de acesso NÃO está aqui: quem decide é o jwt (401) e o acl (403).
  - name: post-function
    config:
      access:
        - |
          if kong.client.get_consumer() == nil then
            return
          end
          local jwt_parser = require "kong.plugins.jwt.jwt_parser"
          local autorizacao = kong.request.get_header("Authorization") or ""
          local token = autorizacao:match("^[Bb]earer%s+(.+)$")
          if not token then
            return
          end
          local jwt = jwt_parser:new(token)
          if not jwt then
            return
          end
          local claims = jwt.claims
          if claims.sub then kong.service.request.set_header("X-User-Id", claims.sub) end
          if claims.email then kong.service.request.set_header("X-User-Email", claims.email) end
          if claims.perfil then kong.service.request.set_header("X-User-Role", claims.perfil) end
